# Processed by the nginx image's envsubst step; ${API_UPSTREAM} comes from the environment.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass ${API_UPSTREAM};
        # Works for both the Compose service name and an HTTPS host on a cloud provider.
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths load index.html and React Router takes over.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
